<div class="p-3">
    <div class="d-flex justify-content-end mb-3" *ngIf="canEdit && !isReadOnly">
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="addHelp()">
            + मदत नोंद
        </button>
    </div>
    <div *ngFor="let help of helpReceived.controls; let i = index" [formGroup]="$any(help)"
        class="p-2 mb-2 bg-light rounded border">
        <div *ngIf="!isEditing(i)" class="d-flex justify-content-between align-items-center px-2 py-1">
            <div class="small">
                <span class="badge bg-info me-2">{{ help.get('helpType')?.value || 'आर्थिक' }}</span>
                <strong class="text-dark" *ngIf="help.get('amount')?.value">₹{{ help.get('amount')?.value }}</strong>
                <span class="text-muted ms-2" *ngIf="help.get('date')?.value">({{ help.get('date')?.value }})</span>
                <span class="text-muted ms-2" *ngIf="help.get('description')?.value">• {{ help.get('description')?.value
                    }}</span>
            </div>
            <div class="d-flex gap-2" *ngIf="canEdit && !isReadOnly">
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2"
                    (click)="toggleEdit(i)">✏️</button>
                <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2"
                    (click)="removeHelp(i)">🗑️</button>
            </div>
        </div>
        <div *ngIf="isEditing(i)" class="pt-2">
            <div class="row g-2 align-items-center">
                <div class="col-6 col-sm-4 col-md-3">
                    <input type="date" class="form-control form-control-sm" formControlName="date" />
                </div>
                <div class="col-6 col-sm-4 col-md-3">
                    <input type="number" class="form-control form-control-sm" formControlName="amount"
                        placeholder="रक्कम (₹)" />
                </div>
                <div class="col-12 col-sm-4 col-md-3">
                    <select class="form-select form-select-sm" formControlName="helpType">
                        <option value="आर्थिक">आर्थिक मदत</option>
                        <option value="वैद्यकीय">वैद्यकीय मदत</option>
                        <option value="शैक्षणिक">शैक्षणिक मदत</option>
                        <option value="इतर">इतर मदत</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <input type="text" class="form-control form-control-sm" formControlName="description"
                        placeholder="तपशील" />
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                    <button *ngIf="newIndexes.has(i)" type="button" class="btn btn-sm btn-outline-secondary"
                        (click)="cancelNew(i)">रद्द करा</button>
                    <button type="button" class="btn btn-sm btn-success px-4" (click)="finishEdit(i)">पूर्ण
                        झाले</button>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="helpReceived.length === 0" class="text-muted small text-center py-2">
        मिळालेल्या मदतीची कोणतीही नोंद नाही
    </div>
</div>
