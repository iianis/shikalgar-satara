<div class="p-3">
    <div class="d-flex justify-content-end mb-3" *ngIf="canEdit && !isReadOnly">
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="addRecommendation()">
            + शिफारस पत्र नोंद
        </button>
    </div>
    <div *ngFor="let rec of recommendations.controls; let i = index" [formGroup]="$any(rec)"
        class="p-2 mb-2 bg-light rounded border">
        <div *ngIf="!isEditing(i)" class="d-flex justify-content-between align-items-center px-2 py-1">
            <div class="small">
                <span class="badge bg-warning text-dark me-2">पत्र</span>
                <strong class="text-dark">{{ rec.get('name')?.value || 'नाव दिलेले नाही' }}</strong>
                <span class="text-muted ms-2" *ngIf="rec.get('date')?.value">({{ rec.get('date')?.value }})</span>
                <span class="text-muted ms-2" *ngIf="rec.get('description')?.value">• {{ rec.get('description')?.value
                    }}</span>
            </div>
            <div class="d-flex gap-2" *ngIf="canEdit && !isReadOnly">
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2"
                    (click)="toggleEdit(i)">✏️</button>
                <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2"
                    (click)="removeRecommendation(i)">🗑️</button>
            </div>
        </div>
        <div *ngIf="isEditing(i)" class="pt-2">
            <div class="row g-2 align-items-center">
                <div class="col-6 col-sm-4 col-md-3">
                    <input type="date" class="form-control form-control-sm" formControlName="date" />
                </div>
                <div class="col-6 col-sm-8 col-md-4">
                    <input type="text" class="form-control form-control-sm" formControlName="name"
                        placeholder="संस्था / व्यक्तीचे नाव *" />
                </div>
                <div class="col-12 col-md-5">
                    <input type="text" class="form-control form-control-sm" formControlName="description"
                        placeholder="शिफारस पत्राचा उद्देश / तपशील" />
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                    <button *ngIf="newIndexes.has(i)" type="button" class="btn btn-sm btn-outline-secondary"
                        (click)="cancelNew(i)">रद्द करा</button>
                    <button type="button" class="btn btn-sm btn-success px-4" (click)="finishEdit(i)">पूर्ण
                        झाले</button>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="recommendations.length === 0" class="text-muted small text-center py-2">
        शिफारस पत्रांची नोंद नाही
    </div>
</div>
