<app-header></app-header>

<div class="container my-4">
    <!-- Persistent Alert Banner Component -->
    <app-alert-banner></app-alert-banner>

    <!-- STEP 1: Search -->
    <div *ngIf="step === 'search'" class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">सभासद शोध</h5>
                    <button class="btn btn-sm btn-light" (click)="goBack()">मागे जा</button>
                </div>
                <div class="card-body p-3 p-md-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold">नाव किंवा मोबाईल नंबर</label>
                            <input type="text" class="form-control" [(ngModel)]="searchTerm"
                                placeholder="सभासदाचे नांव किंवा 10 अंकी मोबाईल नंबर.."
                                (keyup.enter)="searchMember()" />
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-bold">तालुका</label>
                            <select class="form-select" [(ngModel)]="selectedTaluka" (change)="onTalukaChange($event)">
                                <option value="none">सर्व तालुके</option>
                                <option *ngFor="let t of talukaList" [value]="t.name">{{ t.name }}</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-bold">गावं</label>
                            <select class="form-select" [(ngModel)]="selectedVillage"
                                (change)="onVillageChange($event)">
                                <option value="none">सर्व गावे</option>
                                <option *ngFor="let v of filteredSearchVillages" [value]="v.name">{{ v.name }}</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 fw-semibold shadow-sm mt-3" (click)="searchMember()"
                        [disabled]="isLoading">
                        <span *ngIf="!isLoading">🔍 शोध घ्या</span>
                        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- STEP 2: Results -->
    <div *ngIf="step === 'results'" class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-success text-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">सभासद यादी (एकूण: {{ foundMembers.length }})</h5>
                    <button class="btn btn-sm btn-light" (click)="resetSearch()">नवीन शोध</button>
                </div>
                <div class="card-body p-2 p-md-3">
                    <div class="list-group">
                        <div *ngFor="let member of foundMembers"
                            class="list-group-item p-3 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                            <div>
                                <h5 class="mb-0 fw-bold">{{ member.initial }} {{ member.fname }} {{ member.lname }}</h5>
                                <p class="mb-1 text-muted small">{{ member.village }} - {{ member.taluka }}</p>
                                <small class="text-muted"><i class="bi bi-telephone"></i> +91 {{ member.phone }}</small>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-info" (click)="viewMemberDetails(member)">👁️
                                    पहा</button>
                                <button class="btn btn-sm btn-outline-primary" (click)="selectMemberToEdit(member)">✏️
                                    संपादित करा</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- STEP 3: Not Found -->
    <div *ngIf="step === 'not-found'" class="row justify-content-center">
        <div class="col-12 col-md-6 text-center">
            <div class="card shadow-sm border-0 p-4">
                <h5 class="text-warning fw-bold mb-3">सभासद सापडला नाही</h5>
                <div class="d-flex gap-2 justify-content-center mt-3">
                    <button class="btn btn-outline-secondary" (click)="resetSearch()">पुन्हा शोधा</button>
                    <button class="btn btn-primary fw-semibold" (click)="startNewMemberCreation()">+ नवीन सभासद
                        नोंद</button>
                </div>
            </div>
        </div>
    </div>

    <!-- STEP 4: Form Container -->
    <!-- STEP 4: Form Container -->
    <div *ngIf="step === 'form'" class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold">
                {{ isReadOnly ? 'सभासद माहिती' : (isEditMode ? 'सभासद माहिती अद्ययावत करा' : 'नवीन नोंदणी') }}
            </h4>
            <button type="button" class="btn btn-sm btn-light" (click)="goBackFromForm()">मागे जा</button>
        </div>

        <div class="card-body p-3 p-md-4">
            <form [formGroup]="memberForm" (ngSubmit)="onSubmit()">

                <!-- Expand / Collapse All Controls Toolbar -->
                <div class="d-flex justify-content-end align-items-center mb-3">
                    <button type="button" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
                        (click)="toggleAllSections()">
                        <span *ngIf="!areAllExpanded">📂 सर्व विभाग उघडा (Expand All)</span>
                        <span *ngIf="areAllExpanded">📁 सर्व विभाग बंद करा (Collapse All)</span>
                    </button>
                </div>
                <div class="accordion" id="memberFormAccordion">
                    <!-- SECTION 1: Personal Information -->
                    <div class="accordion-item border-light-subtle mb-3 rounded">
                        <h2 class="accordion-header">
                            <button class="accordion-button fw-semibold d-flex align-items-center"
                                [class.collapsed]="!isSectionOpen('personal')"
                                [attr.aria-expanded]="isSectionOpen('personal')" type="button"
                                (click)="toggleSection('personal')">
                                <span>👤 वैयक्तिक माहिती</span>
                            </button>
                        </h2>
                        <div [class.show]="isSectionOpen('personal')" class="accordion-collapse collapse">
                            <div class="accordion-body bg-white p-3">
                                <fieldset [disabled]="!canEditPersonalInfo || isReadOnly">
                                    <app-personal-info-section [formGroup]="memberForm" [talukaList]="talukaList"
                                        [filteredVillages]="filteredVillages">
                                    </app-personal-info-section>
                                </fieldset>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 2: Family Members -->
                    <div class="accordion-item border-light-subtle mb-3 rounded">
                        <h2 class="accordion-header">
                            <button
                                class="accordion-button fw-semibold d-flex justify-content-between align-items-center"
                                [class.collapsed]="!isSectionOpen('family')"
                                [attr.aria-expanded]="isSectionOpen('family')" type="button"
                                (click)="toggleSection('family')">
                                <span>👨‍👩‍👧‍👦 कुटुंबाची माहिती</span>
                                <span class="badge bg-secondary rounded-pill ms-2">{{ familyMembers.length }}</span>
                            </button>
                        </h2>
                        <div [class.show]="isSectionOpen('family')" class="accordion-collapse collapse">
                            <div class="accordion-body bg-white p-0">
                                <app-family-members-section [familyMembers]="familyMembers"
                                    [canEdit]="canEditFamilyMembers" [isReadOnly]="isReadOnly">
                                </app-family-members-section>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 3: Donations -->
                    <div class="accordion-item border-light-subtle mb-3 rounded">
                        <h2 class="accordion-header">
                            <button
                                class="accordion-button fw-semibold d-flex justify-content-between align-items-center"
                                [class.collapsed]="!isSectionOpen('donations')"
                                [attr.aria-expanded]="isSectionOpen('donations')" type="button"
                                (click)="toggleSection('donations')">
                                <span>💰 वर्गणी व देणगी</span>
                                <span class="badge bg-secondary rounded-pill ms-2">{{ donations.length }}</span>
                            </button>
                        </h2>
                        <div [class.show]="isSectionOpen('donations')" class="accordion-collapse collapse">
                            <div class="accordion-body bg-white p-0">
                                <app-donations-section [donations]="donations" [canEdit]="canEditAdminSections"
                                    [isReadOnly]="isReadOnly">
                                </app-donations-section>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 4: Help Received -->
                    <div class="accordion-item border-light-subtle mb-3 rounded">
                        <h2 class="accordion-header">
                            <button
                                class="accordion-button fw-semibold d-flex justify-content-between align-items-center"
                                [class.collapsed]="!isSectionOpen('help')" [attr.aria-expanded]="isSectionOpen('help')"
                                type="button" (click)="toggleSection('help')">
                                <span>🤝 मिळालेली मदत</span>
                                <span class="badge bg-secondary rounded-pill ms-2">{{ helpReceived.length }}</span>
                            </button>
                        </h2>
                        <div [class.show]="isSectionOpen('help')" class="accordion-collapse collapse">
                            <div class="accordion-body bg-white p-0">
                                <app-help-received-section [helpReceived]="helpReceived"
                                    [canEdit]="canEditAdminSections" [isReadOnly]="isReadOnly">
                                </app-help-received-section>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 5: Recommendations -->
                    <div class="accordion-item border-light-subtle mb-3 rounded">
                        <h2 class="accordion-header">
                            <button
                                class="accordion-button fw-semibold d-flex justify-content-between align-items-center"
                                [class.collapsed]="!isSectionOpen('recommendations')"
                                [attr.aria-expanded]="isSectionOpen('recommendations')" type="button"
                                (click)="toggleSection('recommendations')">
                                <span>📜 शिफारस पत्रं</span>
                                <span class="badge bg-secondary rounded-pill ms-2">{{ recommendationLetters.length
                                    }}</span>
                            </button>
                        </h2>
                        <div [class.show]="isSectionOpen('recommendations')" class="accordion-collapse collapse">
                            <div class="accordion-body bg-white p-0">
                                <app-recommendations-section [recommendations]="recommendationLetters"
                                    [canEdit]="canEditAdminSections" [isReadOnly]="isReadOnly">
                                </app-recommendations-section>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-md-end mt-4">
                    <button type="button" class="btn btn-light" (click)="goBackFromForm()">
                        {{ isReadOnly ? 'मागे जा' : 'रद्द करा' }}
                    </button>
                    <button *ngIf="!isReadOnly" type="submit" class="btn btn-primary px-4 fw-semibold"
                        [disabled]="memberForm.invalid || isLoading">
                        नोंद करा
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
