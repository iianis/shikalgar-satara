<header class="shadow-sm mb-4" style="background-color: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <nav class="navbar navbar-dark container">
        <div class="container-fluid justify-content-between align-items-center py-2">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-3" href="#">
                <span class="me-2">🏆</span>
                <span class="tracking-tight">7PD <span class="text-white-50">Sports</span></span>
            </a>

            <div class="d-none d-md-flex align-items-center text-white">
                <div class="badge bg-dark px-3 py-2 rounded-pill">
                    <span class="spinner-grow spinner-grow-sm text-danger me-2" role="status"></span>
                    Live Tracking Active
                </div>
            </div>
        </div>
    </nav>
</header>
<div class="container py-4" id="tournamentlistid">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <!-- <h2 class="display-6 fw-bold text-primary">🏆 7 PD - Sports Tracker</h2> -->
            <p class="text-muted">Manage your tournaments and track live scores.</p>
        </div>
    </div>

    <h4 class="mb-3">Tournaments</h4>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" *ngFor="let t of tournaments2">
            <div class="card h-100 tournament-card shadow-sm border-start border-primary border-4"
                (click)="selectTournament(t.id)">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title text-dark mb-0">{{ t.name }}</h5>
                        <span class="badge rounded-pill bg-info text-dark">{{ t.game }}</span>
                    </div>
                    <p class="card-text text-muted small">
                        <i class="bi bi-calendar-event me-1"></i> {{ t.schedule }}
                    </p>
                </div>
                <div class="card-footer bg-white border-0 text-end">
                    <span class="btn btn-sm btn-outline-primary px-3">View Details</span>
                </div>
            </div>
        </div>
    </div>
</div>
